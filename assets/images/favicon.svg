<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cookie background -->
  <circle cx="50" cy="50" r="45" fill="#D4A574"/>

  <!-- Cookie texture/shading -->
  <circle cx="50" cy="50" r="45" fill="url(#cookieGradient)"/>

  <!-- Chocolate chips -->
  <circle cx="35" cy="30" r="6" fill="#5C4033"/>
  <circle cx="65" cy="35" r="5" fill="#5C4033"/>
  <circle cx="45" cy="55" r="7" fill="#5C4033"/>
  <circle cx="70" cy="60" r="6" fill="#5C4033"/>
  <circle cx="30" cy="65" r="5" fill="#5C4033"/>
  <circle cx="55" cy="25" r="4" fill="#5C4033"/>
  <circle cx="25" cy="48" r="5" fill="#5C4033"/>
  <circle cx="60" cy="70" r="4" fill="#5C4033"/>

  <!-- Cookie edge shading -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#B8956A" stroke-width="2"/>

  <!-- Gradient definition -->
  <defs>
    <radialGradient id="cookieGradient">
      <stop offset="0%" style="stop-color:#E5BC8F;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#B8956A;stop-opacity:0.2" />
    </radialGradient>
  </defs>
</svg>
